spring:
  application:
    name: payment
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment?useSSL=false
    username: postgres
    password: 12345
  security:
    oauth2:
      resourceServer:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: TRUE
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  logging:
    level:
      org:
        hibernate:
          SQL: DEBUG
          type:
            descriptor: TRACE
      blog: DEBUG
      root: debug
server:
  port: 8081
  error:
    whitelabel:
      enabled: false
    path: /error